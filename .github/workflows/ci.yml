name: Python and browser regression tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Python regression suite
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q agents retina_oct_agent cli.py simulator.py enrichment.py
      - name: Browser JavaScript syntax
        run: node --check web/engine.js && node --check web/app.js
      - name: Browser rule engine regression tests
        run: node --test web/test-*.cjs
