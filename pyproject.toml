[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retinal-oct-segmentation-engine"
version = "2.0.0"
description = "RetinaOCT-AI: Optical Coherence Tomography Layer & Biomarker Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[project.scripts]
retinal-oct-segmentation-engine = "retina_oct_agent.cli:main"
retinal-oct-segmentation-agent = "cli:main"

[tool.setuptools]
packages = ["agents", "retina_oct_agent"]
py-modules = ["cli", "simulator", "enrichment", "retina_oct_agent_app"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/retinal-oct-segmentation-agent"
Repository = "https://github.com/abusuraihsakhri/retinal-oct-segmentation-agent.git"
