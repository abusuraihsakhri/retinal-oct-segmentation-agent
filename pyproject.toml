[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retinal-oct-segmentation-engine"
version = "2.0.0"
description = "RetinaOCT-AI: Optical Coherence Tomography Layer & Biomarker Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
retinal-oct-segmentation-engine = "retina_oct_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/retinal-oct-segmentation-engine"
Repository = "https://github.com/abusuraihsakhri/retinal-oct-segmentation-engine.git"
